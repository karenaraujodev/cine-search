<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Cine Search</title>
</head>
<body>
    <header>
        <h1>Cine Search</h1>
        <p>Bem-vindo ao Cine Search!</p>
        <p>Descubra seu próximo filme favorito.</p>
        <p>Pesquise entre milhares de títulos e encontre informações, avaliações e muito mais.</p>
    </header>
    <main>
        <form>
            <div class="search-container">
                <input type="text" id="movie-search" placeholder="Pesquise um filme..." />
                <button type="submit">Buscar</button>
            </div>
        </form>
    <section id="results"></section>
    </main>
</body>
</html>
