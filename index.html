<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Cine Search</title>
</head>
<body>
    
    <header>
        <nav class="navbar">
            <div class="logo">Cine Search</div>
                <ul class="nav-links">
                    <li><a href="#">Início</a></li>
                    <li><a href="#">Favoritos</a></li>
                    <li><a href="#">Sobre</a></li>
                </ul>
        </nav>
        <p class="hero-subtitle">DESCUBRA • PESQUISE • ASSISTA</p>
        <h1>Descubra seu próximo filme favorito.</h1>
        <p class="hero-description">
            Explore milhares de filmes, descubra novas histórias
            e encontre algo perfeito para assistir.
        </p>
    </header>
    <main>
    <section class="search-section">
        <form id="search-form">
            <div class="search-container">
                <input type="text" id="movie-search" placeholder="Pesquise um filme..."/>
                <button type="submit">Buscar</button>
            </div>
        </form>
    </section>
    <section id="results">
    </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
